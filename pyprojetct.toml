[build-system]
requires = ["setuptools", "wheel"]

[project]
name = "faceapp"
requires-python = ">=3.11,<3.12"
dependencies = [
    "streamlit>=1.44.1",
    "deepface>=0.0.93",
    "tensorflow>=2.15.0,<2.18.0",
    "opencv-python>=4.11.0.86",
    "numpy>=2.1.3",
    "pandas>=2.2.3",
    "pillow>=11.2.1"
]